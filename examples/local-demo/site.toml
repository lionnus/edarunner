# Site file of the local demo: one host, the head node itself.
schema = 1
scratch = ["/tmp/edr-demo"]
env = {}
ssh = { options = ["-o", "BatchMode=yes", "-o", "ConnectTimeout=5"], timeout_s = 20 }
tool_procs = "^(sleep)$"

[hosts.local]
cores = 4
ram_gb = 8
tools = { demo = "1.0" }

[tools.demo]
seats = 10
probe = ["bash", "{root}/flow/seats.sh"]
