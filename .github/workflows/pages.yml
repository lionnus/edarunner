name: pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # A deploy on main runs to the end; a newer push on a pull request replaces the older build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NO_MKDOCS_2_WARNING: "1"

jobs:
  docs:
    # A broken link or anchor fails the build, because mkdocs.yml sets strict.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv run --extra docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    needs: docs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
